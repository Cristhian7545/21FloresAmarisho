<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girasol Romántico Mágico</title>
    <style>
        :root {
            --primary-yellow: #ffeb3b;
            --dark-yellow: #f57f17;
            --stem-green: #2e7d32;
            --leaf-green: #4caf50;
            --center-base: #3e2723;
            --center-dark: #1f1209;
            --center-seed1: #271604;
            --center-seed2: #4a2c11;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Cielo nocturno oscuro */
            background: radial-gradient(circle at center 60%, #1b1b3a 0%, #050510 100%);
            height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', serif;
            position: relative;
        }

        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .floating-text {
            position: absolute;
            color: #fff9c4;
            font-size: 1.8rem;
            font-style: italic;
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.8), 0 0 20px rgba(245, 127, 23, 0.6);
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: opacity 2s ease-in-out, transform 4s ease-out;
            transform: translateY(20px);
            white-space: nowrap;
        }

        .floating-text.visible {
            opacity: 1;
            transform: translateY(-30px);
        }

        .floating-text.fade-out {
            opacity: 0;
            transform: translateY(-60px);
        }

        #grass-container {
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 120px;
            z-index: 15;
            display: flex;
            align-items: flex-end;
            pointer-events: none;
        }

        .grass-blade {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            transform-origin: bottom center;
            animation: wind-sway ease-in-out infinite alternate;
        }

        @keyframes wind-sway {
            0% { transform: rotate(-8deg); }
            100% { transform: rotate(12deg); }
        }

        .flower-wrapper {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom center;
            animation: root-sway 6s ease-in-out infinite alternate;
        }

        @keyframes root-sway {
            0% { transform: translateX(-50%) rotate(-3deg); }
            100% { transform: translateX(-50%) rotate(3deg); }
        }

        .stem {
            position: absolute;
            bottom: -50px;
            width: 14px;
            height: 450px;
            background: linear-gradient(to right, #1b5e20, var(--stem-green), #1b5e20);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(46, 125, 50, 0.4);
            z-index: 1;
        }

        .leaf {
            position: absolute;
            width: 90px;
            height: 50px;
            background: linear-gradient(135deg, var(--leaf-green), #1b5e20);
            border-radius: 0 50% 0 50%;
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.2), 0 5px 10px rgba(0,0,0,0.5);
            transform-origin: bottom left;
        }

        .leaf-left {
            bottom: 200px;
            left: -80px;
            animation: leaf-flutter-left 4s ease-in-out infinite alternate;
        }

        .leaf-right {
            bottom: 280px;
            right: -80px;
            transform-origin: bottom right;
            border-radius: 50% 0 50% 0;
            animation: leaf-flutter-right 3.5s ease-in-out infinite alternate;
        }

        @keyframes leaf-flutter-left {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(-25deg) translateY(5px); }
        }

        @keyframes leaf-flutter-right {
            0% { transform: rotate(15deg); }
            100% { transform: rotate(25deg) translateY(5px); }
        }

        .flower-head {
            position: relative;
            width: 140px;
            height: 140px;
            z-index: 2;
            margin-top: 20px;
            animation: breathe 4s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% { transform: scale(0.98); }
            100% { transform: scale(1.02); }
        }

        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background-color: var(--center-base);
            background-image: 
                radial-gradient(var(--center-seed1) 15%, transparent 16%),
                radial-gradient(var(--center-seed2) 15%, transparent 16%);
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 25px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,0,0,0.9);
            border: 3px solid #1a0f0a;
        }

        .petals-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        .petal {
            position: absolute;
            bottom: 50%;
            left: calc(50% - 13px);
            width: 26px;
            height: 130px;
            background: linear-gradient(to bottom, #fff176 0%, var(--primary-yellow) 40%, var(--dark-yellow) 100%);
            border-radius: 50% 50% 20% 20% / 60% 60% 20% 20%;
            transform-origin: bottom center;
            box-shadow: 0 0 15px rgba(245, 127, 23, 0.4);
            border: 1px solid rgba(255, 235, 59, 0.4);
        }

        .petals-back .petal {
            height: 150px;
            width: 34px;
            left: calc(50% - 17px);
            background: linear-gradient(to bottom, #fbc02d 0%, #e65100 100%);
            z-index: 4;
            filter: brightness(0.8) drop-shadow(0 0 10px rgba(230, 81, 0, 0.3));
        }
        
        .petals-middle { z-index: 6; }
        .petals-middle .petal {
            height: 115px;
            width: 22px;
            left: calc(50% - 11px);
            background: linear-gradient(to bottom, #ffff8d 0%, #ffca28 100%);
        }

        /* Nuevo estilo para el título principal */
        .main-title {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff9c4;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-style: italic;
            text-align: center;
            z-index: 30;
            width: 90%;
            pointer-events: none;
            text-shadow: 0 0 15px rgba(255, 235, 59, 0.9), 
                         0 0 30px rgba(245, 127, 23, 0.8),
                         0 0 45px rgba(255, 160, 0, 0.5);
            animation: title-glow 3s ease-in-out infinite alternate;
        }

        @keyframes title-glow {
            0% { text-shadow: 0 0 10px rgba(255, 235, 59, 0.7), 0 0 20px rgba(245, 127, 23, 0.6); }
            100% { text-shadow: 0 0 20px rgba(255, 235, 59, 1), 0 0 40px rgba(245, 127, 23, 0.9), 0 0 60px rgba(255, 160, 0, 0.7); }
        }
    </style>
</head>
<body>

    <!-- Título principal fijo -->
    <h1 class="main-title">¡Feliz 21 de Septiembre!<br>Aquí tienes tus flores amarillas 🌻</h1>

    <!-- Canvas para Estrellas, Hojas Mágicas y Polen -->
    <canvas id="canvas-bg"></canvas>

    <!-- Contenedor de Pasto Animado -->
    <div id="grass-container"></div>

    <div class="flower-wrapper">
        <div class="stem">
            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>
        </div>
        
        <div class="flower-head">
            <div class="petals-layer petals-back" id="petals-back"></div>
            <div class="petals-layer petals-middle" id="petals-middle"></div>
            <div class="petals-layer petals-front" id="petals-front"></div>
            <div class="center"></div>
        </div>
    </div>

    <script>
        const layerFront = document.getElementById('petals-front');
        const layerMiddle = document.getElementById('petals-middle');
        const layerBack = document.getElementById('petals-back');
        
        function createPetals(container, count, offsetAngle = 0) {
            for (let i = 0; i < count; i++) {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                const angle = (360 / count) * i + offsetAngle;
                const randomBend = (Math.random() - 0.5) * 6; 
                const randomScale = 0.9 + Math.random() * 0.2;
                
                petal.style.transform = `rotate(${angle}deg) rotateX(${randomBend}deg) scaleY(${randomScale})`;
                container.appendChild(petal);
            }
        }

        createPetals(layerFront, 20, 0);
        createPetals(layerMiddle, 15, 12);
        createPetals(layerBack, 24, 7.5);

        // Generar pasto
        const grassContainer = document.getElementById('grass-container');
        const totalBlades = Math.floor(window.innerWidth / 10);

        for (let i = 0; i < totalBlades; i++) {
            const blade = document.createElement('div');
            blade.classList.add('grass-blade');
            blade.style.left = `${Math.random() * 100}%`;
            
            const height = 40 + Math.random() * 60;
            const width = 3 + Math.random() * 4;
            blade.style.borderBottom = `${height}px solid`;
            blade.style.borderLeftWidth = `${width}px`;
            blade.style.borderRightWidth = `${width}px`;
            
            const greenShades = ['#1b5e20', '#2e7d32', '#388e3c', '#004d40'];
            blade.style.borderBottomColor = greenShades[Math.floor(Math.random() * greenShades.length)];
            
            blade.style.animationDuration = `${2 + Math.random() * 2}s`;
            blade.style.animationDelay = `-${Math.random() * 2}s`;
            grassContainer.appendChild(blade);
        }

        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;

        // Arrays para los diferentes tipos de partículas
        let stars = [];
        let fireflies = [];
        let leaves = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 1. Clase para Estrellas
        class Star {
            constructor() {
                this.x = Math.random() * width;
                // Las estrellas se concentran en el 60% superior de la pantalla
                this.y = Math.random() * (height * 0.6); 
                this.size = Math.random() * 1.5 + 0.5;
                this.opacity = Math.random();
                this.fadeSpeed = (Math.random() * 0.02) + 0.005;
                this.fadingOut = Math.random() > 0.5;
            }
            update() {
                if (this.fadingOut) {
                    this.opacity -= this.fadeSpeed;
                    if (this.opacity <= 0.1) this.fadingOut = false;
                } else {
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= 0.8) this.fadingOut = true;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.shadowBlur = 5;
                ctx.shadowColor = 'white';
                ctx.fill();
                ctx.shadowBlur = 0; // reset
            }
        }

        // 2. Clase para Destellos de Hojas (Caen)
        class LeafParticle {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : -20;
                this.size = Math.random() * 4 + 2;
                this.speedY = Math.random() * 1 + 0.5; // Caen lentamente
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.1;
                this.opacity = Math.random() * 0.5 + 0.3;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.01) * 1; // Balanceo como hoja
                this.angle += this.spin; // Girar mientras cae
                
                if (this.y > height + 20) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                // Dibujar forma similar a una pequeña hoja / destello mágico
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.quadraticCurveTo(this.size, 0, 0, this.size);
                ctx.quadraticCurveTo(-this.size, 0, 0, -this.size);
                
                // Color verde mágico dorado
                ctx.fillStyle = `rgba(172, 219, 107, ${this.opacity})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#8bc34a'; // Resplandor verde claro
                ctx.fill();
                
                ctx.restore();
            }
        }

        // 3. Clase para Luciérnagas / Polen (Suben)
        class Firefly {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : height + 10;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = -(Math.random() * 1 + 0.5); // Suben
                this.speedX = (Math.random() - 0.5) * 1;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.02) * 0.5;
                this.opacity += (Math.random() - 0.5) * 0.05;
                if(this.opacity < 0.1) this.opacity = 0.1;
                if(this.opacity > 0.8) this.opacity = 0.8;
                if (this.y < -50) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 235, 59, ${this.opacity})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#f57f17';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Inicializar partículas
        for (let i = 0; i < 150; i++) stars.push(new Star());
        for (let i = 0; i < 30; i++) leaves.push(new LeafParticle());
        for (let i = 0; i < 50; i++) fireflies.push(new Firefly());

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            
            // Actualizar y dibujar todo
            stars.forEach(s => { s.update(); s.draw(); });
            leaves.forEach(l => { l.update(); l.draw(); });
            fireflies.forEach(f => { f.update(); f.draw(); });
            
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        const phrases = [
            "Feliz 21 de Septiembre 🌻",
            "✨"
        ];

        function spawnRomanticText() {
            const textElement = document.createElement('div');
            textElement.classList.add('floating-text');
            textElement.innerText = phrases[Math.floor(Math.random() * phrases.length)];
            
            let x, y, isOverlappingCenter;
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight - 250;
            const textWidth = 350;

            do {
                x = Math.random() * (window.innerWidth - textWidth) + 50;
                y = Math.random() * (window.innerHeight - 200) + 50;
                isOverlappingCenter = Math.abs(x - centerX) < 280 && Math.abs(y - centerY) < 320;
            } while(isOverlappingCenter);

            textElement.style.left = `${x}px`;
            textElement.style.top = `${y}px`;
            document.body.appendChild(textElement);

            setTimeout(() => textElement.classList.add('visible'), 100);
            
            setTimeout(() => {
                textElement.classList.add('fade-out');
                setTimeout(() => textElement.remove(), 2000);
            }, 3500);
        }

        setInterval(spawnRomanticText, 3500);
        setTimeout(spawnRomanticText, 500);
    </script>
</body>
</html>
